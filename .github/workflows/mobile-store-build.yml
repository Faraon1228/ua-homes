name: Build store releases

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: ${{ matrix.label }} Android App Bundle
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: drive_community
            label: DriveCommunity
            directory: .
            alias: drive_community_upload
            fingerprint: C6:04:43:13:52:1A:97:DD:62:AE:CB:0E:80:0C:5B:6E:AF:D2:0E:46:30:17:A8:83:98:EF:00:6B:B2:72:59:67
            artifact: drive-community-android-aab
            artifact_path: build/app/outputs/bundle/release/app-release.aab
          - app: ua_dim
            label: UA-Dim
            directory: apps/ua_dim
            alias: ua_dim_upload
            fingerprint: 2B:A6:42:87:54:EA:BA:71:FB:0E:A2:1F:72:17:73:BE:52:88:C9:86:63:F3:0E:18:E1:12:12:27:2E:B2:2C:DE
            artifact: ua-dim-android-aab
            artifact_path: apps/ua_dim/build/app/outputs/bundle/release/app-release.aab
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configure Android upload key
        env:
          KEYSTORE_BASE64: ${{ matrix.app == 'ua_dim' && secrets.UA_DIM_ANDROID_KEYSTORE_BASE64 || secrets.DRIVE_COMMUNITY_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ matrix.app == 'ua_dim' && secrets.UA_DIM_ANDROID_KEYSTORE_PASSWORD || secrets.DRIVE_COMMUNITY_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Android keystore secret is missing"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Android keystore password is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${{ matrix.directory }}/android/app/upload-keystore.jks"
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "${{ matrix.alias }}"
            printf 'storeFile=upload-keystore.jks\n'
          } > "${{ matrix.directory }}/android/key.properties"
      - run: flutter pub get
        working-directory: ${{ matrix.directory }}
      - run: flutter analyze lib test
        working-directory: ${{ matrix.directory }}
      - run: flutter test
        working-directory: ${{ matrix.directory }}
      - run: flutter build appbundle --release
        working-directory: ${{ matrix.directory }}
      - name: Verify Android App Bundle signature
        run: |
          jarsigner -verify -verbose "${{ matrix.artifact_path }}" | grep -F 'jar verified.'
          keytool -printcert -jarfile "${{ matrix.artifact_path }}" |
            grep -F "SHA256: ${{ matrix.fingerprint }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  ios:
    name: ${{ matrix.label }} signed iOS archive
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: drive_community
            label: DriveCommunity
            directory: .
            bundle_id: com.drivecommunity.app
            artifact: drive-community-ios-ipa
          - app: ua_dim
            label: UA-Dim
            directory: apps/ua_dim
            bundle_id: com.uadim.app
            artifact: ua-dim-ios-ipa
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configure Apple Distribution signing
        env:
          CERTIFICATE_BASE64: ${{ matrix.app == 'ua_dim' && secrets.UA_DIM_IOS_DISTRIBUTION_CERTIFICATE_BASE64 || secrets.DRIVE_COMMUNITY_IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ matrix.app == 'ua_dim' && secrets.UA_DIM_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD || secrets.DRIVE_COMMUNITY_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ matrix.app == 'ua_dim' && secrets.UA_DIM_IOS_APP_STORE_PROFILE_BASE64 || secrets.DRIVE_COMMUNITY_IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          test -n "$CERTIFICATE_BASE64" || { echo "Apple Distribution certificate secret is missing"; exit 1; }
          test -n "$CERTIFICATE_PASSWORD" || { echo "Apple Distribution certificate password is missing"; exit 1; }
          test -n "$PROFILE_BASE64" || { echo "App Store provisioning profile secret is missing"; exit 1; }

          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/app-store.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/store-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"
          PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"
          test "$PROFILE_APP_ID" = "$TEAM_ID.${{ matrix.bundle_id }}" || {
            echo "Provisioning profile does not match ${{ matrix.bundle_id }}"
            exit 1
          }
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          {
            printf 'PROFILE_NAME=%s\n' "$PROFILE_NAME"
            printf 'TEAM_ID=%s\n' "$TEAM_ID"
          } >> "$GITHUB_ENV"
      - run: flutter pub get
        working-directory: ${{ matrix.directory }}
      - run: flutter analyze lib test
        working-directory: ${{ matrix.directory }}
      - run: flutter test
        working-directory: ${{ matrix.directory }}
      - run: flutter build ios --release --no-codesign
        working-directory: ${{ matrix.directory }}
      - name: Create signed archive
        working-directory: ${{ matrix.directory }}
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution"
      - name: Export signed IPA
        working-directory: ${{ matrix.directory }}
        run: |
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :destination string export' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:${{ matrix.bundle_id }} string $PROFILE_NAME" "$EXPORT_OPTIONS"
          xcodebuild \
            -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/store \
            -exportOptionsPlist "$EXPORT_OPTIONS"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.directory }}/build/ios/store/*.ipa
          if-no-files-found: error
