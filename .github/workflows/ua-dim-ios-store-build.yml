name: Build UA-Dim iOS store release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: UA-Dim signed iOS archive
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ua_dim
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true
      - name: Configure Apple Distribution signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.UA_DIM_IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.UA_DIM_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.UA_DIM_IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          test -n "$CERTIFICATE_BASE64" || { echo "UA-Dim Apple Distribution certificate secret is missing"; exit 1; }
          test -n "$CERTIFICATE_PASSWORD" || { echo "UA-Dim certificate password secret is missing"; exit 1; }
          test -n "$PROFILE_BASE64" || { echo "UA-Dim App Store provisioning profile secret is missing"; exit 1; }

          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/app-store.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/store-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"
          PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"
          test "$PROFILE_APP_ID" = "$TEAM_ID.com.uadim.app" || {
            echo "Provisioning profile does not match com.uadim.app"
            exit 1
          }
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          {
            printf 'PROFILE_NAME=%s\n' "$PROFILE_NAME"
            printf 'TEAM_ID=%s\n' "$TEAM_ID"
          } >> "$GITHUB_ENV"
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze UA-Dim
        run: flutter analyze lib test
      - name: Test UA-Dim
        run: flutter test
      - name: Prepare iOS build
        run: flutter build ios --release --no-codesign
      - name: Create signed archive
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution"
      - name: Export signed IPA
        run: |
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :destination string export' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.uadim.app string $PROFILE_NAME" "$EXPORT_OPTIONS"
          xcodebuild \
            -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/store \
            -exportOptionsPlist "$EXPORT_OPTIONS"
      - uses: actions/upload-artifact@v5
        with:
          name: ua-dim-ios-ipa
          path: apps/ua_dim/build/ios/store/*.ipa
          if-no-files-found: error
