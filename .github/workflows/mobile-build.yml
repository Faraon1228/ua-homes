name: Build mobile apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "ios/**"
      - "lib/**"
      - "test/**"
      - "apps/ua_dim/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/mobile-build.yml"

jobs:
  build:
    name: ${{ matrix.app }} ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: DriveCommunity
            platform: Android
            runner: ubuntu-latest
            directory: .
            build: apk --release
            artifact: drive-community-android-apk
            artifact_path: build/app/outputs/flutter-apk/app-release.apk
          - app: DriveCommunity
            platform: iOS
            runner: macos-15
            directory: .
            build: ios --release --no-codesign
            artifact: drive-community-ios-app-unsigned
            artifact_path: build/ios/iphoneos/Runner.app
          - app: UA-Dim
            platform: Android
            runner: ubuntu-latest
            directory: apps/ua_dim
            build: apk --release
            artifact: ua-dim-android-apk
            artifact_path: apps/ua_dim/build/app/outputs/flutter-apk/app-release.apk
          - app: UA-Dim
            platform: iOS
            runner: macos-15
            directory: apps/ua_dim
            build: ios --release --no-codesign
            artifact: ua-dim-ios-app-unsigned
            artifact_path: apps/ua_dim/build/ios/iphoneos/Runner.app
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: ${{ matrix.directory }}
      - run: flutter analyze lib test
        working-directory: ${{ matrix.directory }}
      - run: flutter test
        working-directory: ${{ matrix.directory }}
      - run: flutter build ${{ matrix.build }}
        working-directory: ${{ matrix.directory }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
