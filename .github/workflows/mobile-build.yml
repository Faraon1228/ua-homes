name: Build mobile apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "ios/**"
      - "lib/**"
      - "test/**"
      - "apps/ua_dim/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/mobile-build.yml"

jobs:
  build:
    name: ${{ matrix.app }} ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: DriveCommunity
            platform: Android
            runner: ubuntu-latest
            directory: .
            build: apk --release
            artifact: drive-community-android-apk
            artifact_path: build/app/outputs/flutter-apk/app-release.apk
            fingerprint: c6044313521a97dd62aecb0e800c5b6eafd20e463017a88398ef006bb2725967
          - app: DriveCommunity
            platform: iOS
            runner: macos-15
            directory: .
            build: ios --release --no-codesign
            artifact: drive-community-ios-app-unsigned
            artifact_path: build/ios/iphoneos/Runner.app
          - app: UA-Dim
            platform: Android
            runner: ubuntu-latest
            directory: apps/ua_dim
            build: apk --release appbundle --release
            artifact: ua-dim-android-apk
            artifact_path: |
              apps/ua_dim/build/app/outputs/flutter-apk/app-release.apk
              apps/ua_dim/build/app/outputs/bundle/release/app-release.aab
            fingerprint: 2ba6428754eaba71fb0ea21f721773be5288c98663f30e18e11212272eb22cde
          - app: UA-Dim
            platform: iOS
            runner: macos-15
            directory: apps/ua_dim
            build: ios --release --no-codesign
            artifact: ua-dim-ios-app-unsigned
            artifact_path: apps/ua_dim/build/ios/iphoneos/Runner.app
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true
      - name: Configure Android signing
        if: matrix.platform == 'Android'
        env:
          KEYSTORE_BASE64: ${{ matrix.app == 'UA-Dim' && secrets.UA_DIM_ANDROID_KEYSTORE_BASE64 || secrets.DRIVE_COMMUNITY_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ matrix.app == 'UA-Dim' && secrets.UA_DIM_ANDROID_KEYSTORE_PASSWORD || secrets.DRIVE_COMMUNITY_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ matrix.app == 'UA-Dim' && 'ua_dim_upload' || 'drive_community_upload' }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Android keystore secret is missing"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Android keystore password is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${{ matrix.directory }}/android/app/upload-keystore.jks"
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=upload-keystore.jks\n'
          } > "${{ matrix.directory }}/android/key.properties"
      - run: flutter pub get
        working-directory: ${{ matrix.directory }}
      - run: flutter analyze lib test
        working-directory: ${{ matrix.directory }}
      - run: flutter test
        working-directory: ${{ matrix.directory }}
      - name: Build mobile release
        env:
          FIREBASE_API_KEY: ${{ matrix.app == 'UA-Dim' && secrets.UA_DIM_FIREBASE_API_KEY || '' }}
          FIREBASE_APP_ID: ${{ matrix.app == 'UA-Dim' && matrix.platform == 'Android' && secrets.UA_DIM_FIREBASE_ANDROID_APP_ID || matrix.app == 'UA-Dim' && matrix.platform == 'iOS' && secrets.UA_DIM_FIREBASE_IOS_APP_ID || '' }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ matrix.app == 'UA-Dim' && secrets.UA_DIM_FIREBASE_MESSAGING_SENDER_ID || '' }}
          FIREBASE_PROJECT_ID: ${{ matrix.app == 'UA-Dim' && secrets.UA_DIM_FIREBASE_PROJECT_ID || '' }}
          SENTRY_DSN: ${{ matrix.app == 'UA-Dim' && secrets.UA_DIM_SENTRY_DSN || '' }}
          SENTRY_ENVIRONMENT: production
          SENTRY_RELEASE: ua-dim@${{ github.sha }}
          SENTRY_TRACES_SAMPLE_RATE: ${{ vars.UA_DIM_SENTRY_TRACES_SAMPLE_RATE || '0.01' }}
          SENTRY_PROFILES_SAMPLE_RATE: ${{ vars.UA_DIM_SENTRY_PROFILES_SAMPLE_RATE || '0' }}
        run: |
          BUILD_ARGS=()
          if [ "${{ matrix.app }}" = "UA-Dim" ]; then
            [ -z "$FIREBASE_API_KEY" ] || BUILD_ARGS+=("--dart-define=UA_DIM_FIREBASE_API_KEY=$FIREBASE_API_KEY")
            [ -z "$FIREBASE_APP_ID" ] || BUILD_ARGS+=("--dart-define=UA_DIM_FIREBASE_APP_ID=$FIREBASE_APP_ID")
            [ -z "$FIREBASE_MESSAGING_SENDER_ID" ] || BUILD_ARGS+=("--dart-define=UA_DIM_FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID")
            [ -z "$FIREBASE_PROJECT_ID" ] || BUILD_ARGS+=("--dart-define=UA_DIM_FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID")
            [ -z "$SENTRY_DSN" ] || BUILD_ARGS+=("--dart-define=UA_DIM_SENTRY_DSN=$SENTRY_DSN")
            [ -z "$SENTRY_DSN" ] || BUILD_ARGS+=("--dart-define=UA_DIM_SENTRY_ENVIRONMENT=$SENTRY_ENVIRONMENT")
            [ -z "$SENTRY_DSN" ] || BUILD_ARGS+=("--dart-define=UA_DIM_SENTRY_RELEASE=$SENTRY_RELEASE")
            [ -z "$SENTRY_DSN" ] || BUILD_ARGS+=("--dart-define=UA_DIM_SENTRY_TRACES_SAMPLE_RATE=$SENTRY_TRACES_SAMPLE_RATE")
            [ -z "$SENTRY_DSN" ] || BUILD_ARGS+=("--dart-define=UA_DIM_SENTRY_PROFILES_SAMPLE_RATE=$SENTRY_PROFILES_SAMPLE_RATE")
          fi
          flutter build ${{ matrix.build }} "${BUILD_ARGS[@]}"
        working-directory: ${{ matrix.directory }}
      - name: Verify Android release signature
        if: matrix.platform == 'Android'
        run: |
          KEYTOOL="$(find "$JAVA_HOME" -name keytool -type f | head -1)"
          test -x "$KEYTOOL" || { echo "keytool was not found"; exit 1; }
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$APKSIGNER" || { echo "apksigner was not found"; exit 1; }
          APK_PATH="${{ matrix.directory }}/build/app/outputs/flutter-apk/app-release.apk"
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK_PATH")"
          printf '%s\n' "$CERT_OUTPUT"
          ACTUAL_FINGERPRINT="$(
            printf '%s\n' "$CERT_OUTPUT" |
              sed -n 's/^.*certificate SHA-256 digest: //p' |
              head -1 |
              tr '[:upper:]' '[:lower:]' |
              tr -d ':[:space:]'
          )"
          test "$ACTUAL_FINGERPRINT" = "${{ matrix.fingerprint }}" || {
            echo "Unexpected Android signing certificate: $ACTUAL_FINGERPRINT"
            exit 1
          }
          if [ "${{ matrix.app }}" = "UA-Dim" ]; then
            AAB_PATH="${{ matrix.directory }}/build/app/outputs/bundle/release/app-release.aab"
            test -f "$AAB_PATH" || { echo "AAB was not generated: $AAB_PATH"; exit 1; }
            AAB_FINGERPRINT="$(
              "$KEYTOOL" -printcert -jarfile "$AAB_PATH" |
                sed -n 's/^.*SHA256: //p' |
                head -1 |
                tr '[:upper:]' '[:lower:]' |
                tr -d ':[:space:]'
            )"
            test -n "$AAB_FINGERPRINT" || { echo "Unable to read AAB signing certificate"; exit 1; }
            test "$AAB_FINGERPRINT" = "${{ matrix.fingerprint }}" || {
              echo "Unexpected AAB signing certificate: $AAB_FINGERPRINT"
              exit 1
            }
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
