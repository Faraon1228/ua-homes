name: Quality gates

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - agents/real-estate-filtering-feature

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements.txt
      - name: Compile backend
        run: python -m py_compile backend/app.py backend/admin_routes.py backend/configuration.py backend/monitoring.py backend/security_policy.py backend/time_helpers.py backend/migrate_sqlite_to_postgres.py backend/test_trust_features.py backend/test_admin_panel.py backend/test_foundations.py backend/test_monitoring.py
      - name: Run backend regression suite
        run: python -m unittest backend.test_trust_features backend.test_admin_panel backend.test_foundations backend.test_monitoring

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install frontend build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild generated frontend
        run: ./scripts/rebuild-frontend.sh
      - name: Verify generated artifacts are current
        run: git diff --exit-code -- web/real-estate-app.js web/seller-app.js web/chunks web/precache-manifest.js web/ua-homes.css web/admin
      - name: Validate Netlify deployment contract
        run: |
          python3 scripts/validate-netlify-admin-config.py
          python3 scripts/validate-deploy-workflow.py
      - name: Validate production substitutions
        env:
          UA_HOMES_API: https://backend.example.test
          UA_HOMES_PUBLIC_URL: https://ua-dim.com
        run: |
          python3 scripts/build-real-estate-demo.py
          python3 scripts/validate-assetlinks.py
          ! grep -R -F '__UA_HOMES_API__' web/real-estate-demo.html web/real-estate-app.js
          ! grep -F '__UA_HOMES_PUBLIC_URL__' web/robots.txt

      - name: Install admin browser runtime
        run: npx playwright install --with-deps chromium
      - name: Run admin browser regression suite
        run: npm run test:admin

  ua-dim-mobile:
    name: UA-Dim mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ua_dim
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Verify locked dependencies
        run: git diff --exit-code -- pubspec.lock
      - name: Analyze UA-Dim
        run: flutter analyze lib test
      - name: Test UA-Dim
        run: flutter test --reporter expanded
