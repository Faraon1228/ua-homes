name: Quality gates

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - agents/real-estate-filtering-feature

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements.txt
      - name: Compile backend
        run: python -m py_compile backend/app.py backend/admin_routes.py backend/migrate_sqlite_to_postgres.py backend/test_trust_features.py backend/test_admin_panel.py
      - name: Run backend regression suite
        run: python -m unittest backend.test_trust_features backend.test_admin_panel

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rebuild generated frontend
        run: ./scripts/rebuild-frontend.sh
      - name: Verify generated artifacts are current
        run: git diff --exit-code -- web/real-estate-app.js web/seller-app.js web/chunks web/precache-manifest.js web/ua-homes.css web/admin
      - name: Validate deployed admin security policy
        run: python3 scripts/validate-netlify-admin-config.py
      - name: Validate production substitutions
        env:
          UA_HOMES_API: https://backend.example.test
          UA_HOMES_PUBLIC_URL: https://ua-dim.com
        run: |
          python3 scripts/build-real-estate-demo.py
          python3 -m json.tool web/.well-known/assetlinks.json >/dev/null
          python3 -c 'import json, pathlib; statement = json.loads(pathlib.Path("web/.well-known/assetlinks.json").read_text())[0]; assert statement["relation"] == ["delegate_permission/common.handle_all_urls"]; target = statement["target"]; assert target["namespace"] == "android_app" and target["package_name"] == "com.uadim.app"; assert target["sha256_cert_fingerprints"] == ["2B:A6:42:87:54:EA:BA:71:FB:0E:A2:1F:72:17:73:BE:52:88:C9:86:63:F3:0E:18:E1:12:12:27:2E:B2:2C:DE"]'
          ! grep -R -F '__UA_HOMES_API__' web/real-estate-demo.html web/real-estate-app.js
          ! grep -F '__UA_HOMES_PUBLIC_URL__' web/robots.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install admin browser test dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run admin browser regression suite
        run: npm run test:admin

  ua-dim-mobile:
    name: UA-Dim mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ua_dim
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Verify locked dependencies
        run: git diff --exit-code -- pubspec.lock
      - name: Analyze UA-Dim
        run: flutter analyze lib test
      - name: Test UA-Dim
        run: flutter test --reporter expanded
