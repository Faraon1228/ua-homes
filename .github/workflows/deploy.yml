name: Deploy UA Homes

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agents/real-estate-filtering-feature

jobs:
  deploy-backend:
    name: Deploy backend to Railway
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: 7e0830d5-3069-4447-95b6-8faec9a0c190
      RAILWAY_PROJECT_ID: d1e64b28-213b-4b55-b3e3-0eff6a977c96
    steps:
      - uses: actions/checkout@v4
      - name: Check Railway token
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is missing. Add it in Settings → Secrets → Actions."
            exit 1
          fi
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      # The service sets Root Directory to "backend", so the upload must start
      # from the repository root or nixpacks looks for "backend/backend".
      - name: Deploy backend
        run: railway up --ci --service "$RAILWAY_SERVICE_ID" --project "$RAILWAY_PROJECT_ID" --environment production


  deploy-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static site
        env:
          UA_HOMES_API: ${{ secrets.UA_HOMES_API }}
        run: python3 scripts/build-real-estate-demo.py
      - name: Upload to Netlify (manual)
        run: |
          echo "✅ Frontend built successfully"
          echo "📦 Frontend files: web/"
          echo ""
          echo "🚀 To deploy to Netlify:"
          echo "1. Go to https://app.netlify.com"
          echo "2. Connect this GitHub repo or upload web/ folder"
          echo "3. Set build command: python3 scripts/build-real-estate-demo.py"
          echo "4. Set publish directory: web/"
          ls -la web/ | head -10
