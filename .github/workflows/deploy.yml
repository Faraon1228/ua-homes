name: Deploy UA Homes

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agents/real-estate-filtering-feature

jobs:
  deploy-backend:
    name: Deploy backend to Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy backend with Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git remote add railway "https://git.railway.app/${{ secrets.RAILWAY_GIT_URL }}.git" 2>/dev/null || true
          git push railway agents/real-estate-filtering-feature:main --force 2>&1 || echo "Railway Git deploy not configured yet. Backend files are committed to GitHub."


  deploy-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static site
        env:
          UA_HOMES_API: ${{ secrets.UA_HOMES_API }}
        run: python3 scripts/build-real-estate-demo.py
      - name: Upload to Netlify (manual)
        run: |
          echo "✅ Frontend built successfully"
          echo "📦 Frontend files: web/"
          echo ""
          echo "🚀 To deploy to Netlify:"
          echo "1. Go to https://app.netlify.com"
          echo "2. Connect this GitHub repo or upload web/ folder"
          echo "3. Set build command: python3 scripts/build-real-estate-demo.py"
          echo "4. Set publish directory: web/"
          ls -la web/ | head -10
