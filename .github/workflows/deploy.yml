name: Deploy UA Homes

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agents/real-estate-filtering-feature

# The backend is deployed by Railway's own GitHub integration: the "backend"
# service watches Faraon1228/ua-homes@main with Root Directory "backend".
jobs:
  deploy-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static site
        env:
          UA_HOMES_API: ${{ secrets.UA_HOMES_API }}
        run: python3 scripts/build-real-estate-demo.py
      - name: Upload to Netlify (manual)
        run: |
          echo "✅ Frontend built successfully"
          echo "📦 Frontend files: web/"
          echo ""
          echo "🚀 To deploy to Netlify:"
          echo "1. Go to https://app.netlify.com"
          echo "2. Connect this GitHub repo or upload web/ folder"
          echo "3. Set build command: python3 scripts/build-real-estate-demo.py"
          echo "4. Set publish directory: web/"
          ls -la web/ | head -10
