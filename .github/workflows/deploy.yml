name: Deploy UA Homes

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agents/real-estate-filtering-feature

# Netlify and Railway deploy through their GitHub integrations. This workflow
# validates the generated frontend without duplicating either production deploy.
jobs:
  validate-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build static site
        env:
          UA_HOMES_API: ${{ secrets.UA_HOMES_API }}
          UA_HOMES_PUBLIC_URL: https://ua-dim.com
        run: python3 scripts/build-real-estate-demo.py
