name: Deploy UA Homes

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agents/real-estate-filtering-feature

jobs:
  deploy-backend:
    name: Deploy backend to Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy backend with Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git remote add railway "https://git.railway.app/${{ secrets.RAILWAY_GIT_URL }}.git" 2>/dev/null || true
          git push railway agents/real-estate-filtering-feature:main --force 2>&1 || echo "Railway Git deploy not configured yet. Backend files are committed to GitHub."


  deploy-frontend:
    name: Deploy frontend to Netlify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static site
        env:
          UA_HOMES_API: ${{ secrets.UA_HOMES_API }}
        run: python3 scripts/build-real-estate-demo.py
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: web
          production-branch: main
          deploy-message: "Deploy UA Homes"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auth-token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          site-id: ${{ secrets.NETLIFY_SITE_ID }}
