name = "ua-dim-api"
main = "ua-dim-api-worker.js"
compatibility_date = "2026-09-11"

# Configure this route only after the secret exists in both Cloudflare and Railway.
routes = [
  { pattern = "ua-dim.com/api/*", zone_name = "ua-dim.com" },
  { pattern = "www.ua-dim.com/api/*", zone_name = "ua-dim.com" }
]

[vars]
# The actual value must be created with `wrangler secret put UA_HOMES_EDGE_TOKEN`.
# Never commit the token.
