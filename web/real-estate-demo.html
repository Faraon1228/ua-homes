<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="UA Homes"/>
  <meta name="theme-color" content="#1e293b"/>
  <meta name="description" content="Пошук нерухомості в Україні. єОселя, іпотека, карта, порівняння."/>
  <link rel="manifest" href="ua-homes-manifest.json"/>
  <link rel="apple-touch-icon" href="icons/Icon-192.png"/>
  <title>UA Homes — нерухомість в Україні</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root{color-scheme:light}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
    button,input,select,textarea{min-height:44px;touch-action:manipulation;font:inherit}
    textarea{min-height:auto}
    @supports(padding:max(0px)){body{padding-bottom:max(1rem,env(safe-area-inset-bottom))}}
    .modal-backdrop{animation:fadeIn .15s ease}
    .modal-box{animation:slideUp .22s ease}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}
    .gallery-img{transition:opacity .25s}
    .star-btn{background:none;border:none;padding:0;min-height:auto;cursor:pointer;line-height:1;font-size:1.5rem}
    .leaflet-container{border-radius:1.25rem}
    .compare-bar{animation:slideUp .2s ease}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .animate-pulse{animation:pulse 1.5s cubic-bezier(.4,0,.6,1) infinite}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:#f1f5f9}
    ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9999px}
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
<div id="root"></div>

<script type="text/babel">
const {useEffect,useMemo,useCallback,useState,useRef} = React;

/* ─── Constants ─── */
// Production: set window.UA_HOMES_API before this script, or use env placeholder
// Local dev: auto-detect network IP vs localhost
const API = (() => {
  if (window.UA_HOMES_API) return window.UA_HOMES_API;
  const configured = "__UA_HOMES_API__";
  if (configured && configured !== "__UA_HOMES_API__") return configured;
  const h = location.hostname;
  if (h === "localhost" || h === "127.0.0.1") return "http://localhost:5050";
  // Same host but different port (e.g. Vercel proxies /api to backend)
  if (!h.includes("192.168") && !h.match(/^\d+\.\d+/)) return `https://${h.replace(/^www\./,'')}`.replace(/\/$/, '') + '/api-backend';
  return `http://${h}:5050`;
})();
const TOKEN = "uah.token";
const SESS  = "uah.session";
const FP    = "re.";
const FKEYS = ["cityFilter","typeFilter","onlyEOselya","minPrice","maxPrice","minRooms","maxRooms","minArea","maxArea","sortBy"];
const DEFAULT_SORT  = "price-desc";
const EOSELYA_SORT  = "price-asc";
const CITIES    = ["Всі","Київ","Львів","Харків","Одеса","Дніпро","Запоріжжя","Вінниця","Полтава"];
const PTYPES    = ["Всі","квартира","будинок","комерція","земля"];
const CONDS     = ["нова будова","вторинка","після ремонту","без ремонту"];
const MAX_COMPARE = 3;

/* ─── localStorage ─── */
const ls = {
  get:(k,fb=null)=>{try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):fb}catch{return fb}},
  set:(k,v)=>localStorage.setItem(k,JSON.stringify(v)),
  del:(k)=>localStorage.removeItem(k),
};
const gf = (key,fb) => {const v=localStorage.getItem(FP+key);return v!==null?v:fb};

/* ─── API layer ─── */
const api = async (path,{method="GET",body,token}={}) => {
  const h = {"Content-Type":"application/json"};
  if(token) h["Authorization"]=`Bearer ${token}`;
  const r = await fetch(API+path,{method,headers:h,body:body!==undefined?JSON.stringify(body):undefined});
  const d = await r.json();
  if(!r.ok) throw {...(d||{}),status:r.status};
  return d;
};

/* ─── normListing ─── */
const norm = r => ({
  id:r.id, title:r.title, city:r.city, district:r.district,
  propertyType:r.property_type, conditionType:r.condition_type,
  price:r.price, rooms:r.rooms, area:r.area,
  floor:r.floor, totalFloors:r.total_floors, yearBuilt:r.year_built,
  eOselya:Boolean(r.e_oselya), views:r.views||0,
  images:Array.isArray(r.images)?r.images:[],
  latitude:r.latitude, longitude:r.longitude,
  description:r.description||"",
  ownerEmail:r.owner_email, ownerName:r.owner_name,
  createdAt:r.created_at,
  reviews:r.reviews||[],
});

/* ─── MODAL BASE ─── */
function Modal({title,onClose,wide,children}){
  useEffect(()=>{
    const fn=e=>e.key==="Escape"&&onClose();
    window.addEventListener("keydown",fn);
    return()=>window.removeEventListener("keydown",fn);
  },[onClose]);
  return(
    <div className="modal-backdrop fixed inset-0 z-50 flex items-start justify-center bg-black/60 p-4 overflow-y-auto" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className={`modal-box w-full ${wide?"max-w-3xl":"max-w-md"} rounded-3xl bg-white p-6 shadow-2xl my-8`}>
        <div className="mb-5 flex items-center justify-between">
          <h2 className="text-xl font-black text-slate-900">{title}</h2>
          <button onClick={onClose} className="flex h-9 w-9 items-center justify-center rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 transition" style={{minHeight:"auto"}}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

/* ─── PHOTO GALLERY ─── */
function PhotoGallery({images,large}){
  const [idx,setIdx] = useState(0);
  const imgs = images&&images.length?images:[];
  if(!imgs.length) return(
    <div className={`flex items-center justify-center bg-slate-100 ${large?"h-72":"h-48"} text-slate-300 text-5xl`}>🏠</div>
  );
  const prev=()=>setIdx(i=>(i-1+imgs.length)%imgs.length);
  const next=()=>setIdx(i=>(i+1)%imgs.length);
  return(
    <div className={`relative overflow-hidden bg-slate-200 ${large?"h-72 sm:h-96":"h-48 sm:h-full"}`}>
      <img key={idx} src={imgs[idx]} alt="" className={`gallery-img h-full w-full object-cover ${large?"":"group-hover:scale-105"} transition duration-500`}/>
      {imgs.length>1&&(
        <>
          <button onClick={e=>{e.stopPropagation();prev()}} className="absolute left-2 top-1/2 -translate-y-1/2 flex h-8 w-8 items-center justify-center rounded-full bg-black/50 text-white text-lg hover:bg-black/70 transition" style={{minHeight:"auto"}}>‹</button>
          <button onClick={e=>{e.stopPropagation();next()}} className="absolute right-2 top-1/2 -translate-y-1/2 flex h-8 w-8 items-center justify-center rounded-full bg-black/50 text-white text-lg hover:bg-black/70 transition" style={{minHeight:"auto"}}>›</button>
          <div className="absolute bottom-2 left-1/2 -translate-x-1/2 flex gap-1">
            {imgs.map((_,i)=>(
              <button key={i} onClick={e=>{e.stopPropagation();setIdx(i)}} className={`h-1.5 rounded-full transition-all ${i===idx?"w-4 bg-white":"w-1.5 bg-white/60"}`} style={{minHeight:"auto"}}/>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

/* ─── MAP EMBED ─── */
function MapEmbed({lat,lng,title}){
  const ref = useRef(null);
  useEffect(()=>{
    if(!ref.current||!lat||!lng) return;
    const map = L.map(ref.current,{zoomControl:true,scrollWheelZoom:false}).setView([lat,lng],15);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
      attribution:"© OpenStreetMap",maxZoom:19
    }).addTo(map);
    L.marker([lat,lng]).addTo(map).bindPopup(title||"Об'єкт").openPopup();
    return()=>map.remove();
  },[lat,lng,title]);
  if(!lat||!lng) return(
    <div className="flex h-48 items-center justify-center rounded-2xl bg-slate-100 text-slate-400">Координати не вказані</div>
  );
  return <div ref={ref} className="h-56 w-full rounded-[20px] z-0"/>;
}

/* ─── STARS ─── */
function Stars({value,onChange}){
  const [hover,setHover]=useState(0);
  return(
    <div className="flex gap-1">
      {[1,2,3,4,5].map(n=>(
        <button key={n} type="button" className="star-btn" onMouseEnter={()=>onChange&&setHover(n)} onMouseLeave={()=>onChange&&setHover(0)} onClick={()=>onChange&&onChange(n)}>
          <span className={(hover||value)>=n?"text-amber-400":"text-slate-300"}>★</span>
        </button>
      ))}
    </div>
  );
}

/* ─── MORTGAGE CALC MODAL ─── */
function MortgageCalcModal({onClose}){
  const [price,setPrice]=useState("100000");
  const [down,setDown]=useState("20");
  const [rate,setRate]=useState("7");
  const [years,setYears]=useState("20");

  const result = useMemo(()=>{
    const p=Number(price)||0, d=Number(down)||0, r=Number(rate)||0, y=Number(years)||1;
    const loan=(p*(1-d/100));
    if(loan<=0||r<=0) return null;
    const mr=r/100/12, n=y*12;
    const monthly=loan*(mr*Math.pow(1+mr,n))/(Math.pow(1+mr,n)-1);
    const total=monthly*n;
    return{loan:Math.round(loan),monthly:Math.round(monthly),total:Math.round(total),overpay:Math.round(total-loan)};
  },[price,down,rate,years]);

  const fi="min-h-[48px] w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:bg-white";
  return(
    <Modal title="Калькулятор іпотеки єОселя" onClose={onClose}>
      <div className="space-y-4">
        <div className="grid grid-cols-2 gap-3">
          <div><label className="mb-1 block text-xs font-black uppercase tracking-wide text-slate-500">Вартість, $</label><input type="number" value={price} onChange={e=>setPrice(e.target.value)} className={fi}/></div>
          <div><label className="mb-1 block text-xs font-black uppercase tracking-wide text-slate-500">Перший внесок, %</label><input type="number" min="0" max="100" value={down} onChange={e=>setDown(e.target.value)} className={fi}/></div>
          <div>
            <label className="mb-1 block text-xs font-black uppercase tracking-wide text-slate-500">Ставка, %</label>
            <div className="flex gap-2">
              <button onClick={()=>setRate("3")} className={`flex-1 rounded-xl py-2 text-sm font-bold transition ${rate==="3"?"bg-blue-600 text-white":"bg-slate-100 text-slate-600 hover:bg-slate-200"}`} style={{minHeight:"auto"}}>3% єОселя</button>
              <button onClick={()=>setRate("7")} className={`flex-1 rounded-xl py-2 text-sm font-bold transition ${rate==="7"?"bg-blue-600 text-white":"bg-slate-100 text-slate-600 hover:bg-slate-200"}`} style={{minHeight:"auto"}}>7% єОселя</button>
            </div>
            <input type="number" step="0.1" value={rate} onChange={e=>setRate(e.target.value)} className={`mt-2 ${fi}`}/>
          </div>
          <div><label className="mb-1 block text-xs font-black uppercase tracking-wide text-slate-500">Строк, років</label><select value={years} onChange={e=>setYears(e.target.value)} className={fi}>{[5,10,15,20,25,30].map(y=><option key={y}>{y}</option>)}</select></div>
        </div>
        {result?(
          <div className="rounded-2xl bg-gradient-to-br from-blue-600 to-sky-500 p-5 text-white">
            <div className="grid grid-cols-2 gap-4">
              <div><div className="text-xs font-semibold text-blue-100 uppercase tracking-wide">Сума кредиту</div><div className="mt-1 text-2xl font-black">${result.loan.toLocaleString()}</div></div>
              <div><div className="text-xs font-semibold text-blue-100 uppercase tracking-wide">Щомісячний платіж</div><div className="mt-1 text-2xl font-black">${result.monthly.toLocaleString()}</div></div>
              <div><div className="text-xs font-semibold text-blue-100 uppercase tracking-wide">Загальна сума</div><div className="mt-1 text-lg font-bold">${result.total.toLocaleString()}</div></div>
              <div><div className="text-xs font-semibold text-blue-100 uppercase tracking-wide">Переплата</div><div className="mt-1 text-lg font-bold">${result.overpay.toLocaleString()}</div></div>
            </div>
          </div>
        ):(
          <div className="rounded-2xl bg-slate-100 p-4 text-center text-slate-400 text-sm">Введіть дані для розрахунку</div>
        )}
        <p className="text-xs text-slate-400">Розрахунок орієнтовний. Реальні умови — у банках-партнерах єОселя.</p>
      </div>
    </Modal>
  );
}

/* ─── SAFETY CHECKLIST MODAL ─── */
function SafetyModal({onClose}){
  const items=[
    "Виписка з реєстру прав власності (Держгеокадастр)",
    "Перевірка обтяжень та арештів через Єдиний реєстр судових рішень",
    "Технічний паспорт на квартиру / будинок",
    "Довідка про відсутність боргів по комунальних послугах",
    "Довідка про зареєстрованих осіб (форма 3)",
    "Нотаріально завірена згода другого з подружжя (якщо є)",
    "Перевірка забудовника в реєстрі — для нових будов",
    "Кадастровий номер ділянки (для будинків та землі)",
    "Перевірка продавця через ЄДРЮО та Мін'юст",
    "Незалежна оцінка вартості майна",
  ];
  const [checked,setChecked]=useState(()=>new Array(items.length).fill(false));
  const done=checked.filter(Boolean).length;
  return(
    <Modal title="Чек-лист перевірки документів" onClose={onClose} wide>
      <div className="mb-4 h-2 rounded-full bg-slate-100 overflow-hidden"><div className="h-full rounded-full bg-blue-600 transition-all" style={{width:`${(done/items.length)*100}%`}}/></div>
      <p className="mb-4 text-sm text-slate-500">Виконано {done} з {items.length} пунктів</p>
      <div className="space-y-2">
        {items.map((item,i)=>(
          <label key={i} className={`flex cursor-pointer items-center gap-3 rounded-2xl border p-3 transition ${checked[i]?"border-green-200 bg-green-50":"border-slate-100 bg-slate-50 hover:bg-slate-100"}`}>
            <input type="checkbox" checked={checked[i]} onChange={()=>setChecked(c=>{const n=[...c];n[i]=!n[i];return n})} className="h-5 w-5 accent-blue-600"/>
            <span className={`text-sm ${checked[i]?"text-green-700 line-through":"text-slate-700"}`}>{item}</span>
          </label>
        ))}
      </div>
    </Modal>
  );
}

/* ─── COMPARE MODAL ─── */
function CompareModal({items,onClose}){
  const fields=[
    {label:"Тип",key:"propertyType"},{label:"Стан",key:"conditionType"},
    {label:"Ціна, $",key:p=>p.price.toLocaleString()},
    {label:"Площа, м²",key:"area"},{label:"Кімнати",key:"rooms"},
    {label:"Поверх",key:p=>`${p.floor}/${p.totalFloors}`},
    {label:"Рік",key:p=>p.yearBuilt||"—"},
    {label:"єОселя",key:p=>p.eOselya?"✅ Так":"✗ Ні"},
    {label:"Перегляди",key:"views"},
  ];
  return(
    <Modal title={`Порівняння (${items.length})`} onClose={onClose} wide>
      <div className="overflow-x-auto">
        <table className="w-full border-collapse text-sm">
          <thead>
            <tr>
              <th className="w-28 text-left text-xs font-black uppercase tracking-wide text-slate-400 pb-3">Параметр</th>
              {items.map(p=>(
                <th key={p.id} className="pb-3 px-3 text-left">
                  <div className="font-black text-slate-900 leading-snug">{p.title}</div>
                  <div className="text-xs text-slate-400">{p.city}, {p.district}</div>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {fields.map(f=>(
              <tr key={f.label} className="border-t border-slate-100">
                <td className="py-2 text-xs font-bold uppercase tracking-wide text-slate-400">{f.label}</td>
                {items.map(p=>(
                  <td key={p.id} className="py-2 px-3 font-semibold text-slate-700">
                    {typeof f.key==="function"?f.key(p):p[f.key]}
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </Modal>
  );
}

/* ─── PROPERTY DETAIL MODAL ─── */
function PropertyDetailModal({property,currentUser,token,onClose,onDelete,onReviewAdded}){
  const [reviews,setReviews]=useState(property.reviews||[]);
  const [rating,setRating]=useState(0);
  const [comment,setComment]=useState("");
  const [submitting,setSubmitting]=useState(false);
  const [revErr,setRevErr]=useState("");

  const avgRating = reviews.length ? (reviews.reduce((s,r)=>s+r.rating,0)/reviews.length).toFixed(1) : null;

  const submitReview = async e => {
    e.preventDefault();
    if(!rating){setRevErr("Оберіть рейтинг");return;}
    if(comment.trim().length<5){setRevErr("Мінімум 5 символів");return;}
    setSubmitting(true);setRevErr("");
    try{
      const res = await api(`/api/listings/${property.id}/reviews`,{method:"POST",token,body:{rating,comment:comment.trim()}});
      setReviews(rv=>[res.review,...rv]);
      setRating(0);setComment("");
    }catch(err){setRevErr(err.error||"Помилка")}
    finally{setSubmitting(false);}
  };

  return(
    <Modal title={property.title} onClose={onClose} wide>
      <PhotoGallery images={property.images} large/>
      <div className="mt-5 grid gap-5 md:grid-cols-2">
        <div>
          <div className="flex flex-wrap gap-2 mb-3">
            {property.eOselya&&<span className="rounded-full bg-blue-600 px-3 py-1 text-xs font-black text-white uppercase tracking-wide">єОселя</span>}
            <span className="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-600">{property.propertyType}</span>
            <span className="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-600">{property.conditionType}</span>
          </div>
          <div className="text-3xl font-black text-blue-600 mb-1">${property.price.toLocaleString()}</div>
          <div className="text-sm text-slate-500 mb-4">{property.city}, {property.district}</div>
          {property.description&&<p className="text-sm text-slate-600 leading-relaxed mb-4">{property.description}</p>}
          <table className="w-full text-sm border-collapse">
            <tbody>
              {[
                ["Площа",""+property.area+" м²"],
                ["Кімнати",property.rooms===0?"Без кімнат (студія/офіс)":""+property.rooms],
                ["Поверх",""+property.floor+" / "+property.totalFloors],
                ["Рік будівлі",property.yearBuilt||"—"],
                ["Перегляди","👁 "+property.views],
                ["Продавець",property.ownerName||property.ownerEmail],
              ].map(([k,v])=>(
                <tr key={k} className="border-t border-slate-100">
                  <td className="py-1.5 text-xs font-bold uppercase tracking-wide text-slate-400">{k}</td>
                  <td className="py-1.5 font-semibold text-slate-700">{v}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div>
          <div className="text-xs font-black uppercase tracking-wide text-slate-400 mb-2">Локація</div>
          <MapEmbed lat={property.latitude} lng={property.longitude} title={property.title}/>
        </div>
      </div>

      {/* Reviews */}
      <div className="mt-6">
        <div className="flex items-center justify-between mb-3">
          <div className="text-sm font-black uppercase tracking-wide text-slate-500">Відгуки ({reviews.length})</div>
          {avgRating&&<div className="flex items-center gap-1 text-amber-400 font-black">★ {avgRating}</div>}
        </div>
        {currentUser ? (
          <form onSubmit={submitReview} className="mb-4 rounded-2xl border border-slate-200 bg-slate-50 p-4">
            <div className="mb-2 text-xs font-bold uppercase tracking-wide text-slate-500">Ваша оцінка</div>
            <Stars value={rating} onChange={setRating}/>
            <textarea value={comment} onChange={e=>setComment(e.target.value)} placeholder="Напишіть відгук…" className="mt-3 w-full resize-none rounded-2xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-blue-500 transition" rows={3} style={{minHeight:"auto"}}/>
            {revErr&&<p className="mt-1 text-xs text-red-500">{revErr}</p>}
            <button type="submit" disabled={submitting} className="mt-2 min-h-[40px] rounded-2xl bg-blue-600 px-5 text-sm font-bold text-white hover:bg-blue-700 transition disabled:opacity-60">{submitting?"Надсилається…":"Надіслати відгук"}</button>
          </form>
        ):(
          <p className="mb-4 rounded-2xl bg-slate-50 p-3 text-sm text-slate-400">Увійдіть, щоб залишити відгук</p>
        )}
        <div className="space-y-3 max-h-64 overflow-y-auto">
          {reviews.length===0&&<p className="text-sm text-slate-400">Поки відгуків немає. Будьте першим!</p>}
          {reviews.map(r=>(
            <div key={r.id} className="rounded-2xl border border-slate-100 bg-white p-3">
              <div className="flex items-center justify-between mb-1">
                <span className="text-sm font-bold text-slate-700">{r.user_name}</span>

/* ─── AUTH MODAL ─── */
function AuthModal({onClose,onAuth}){
  const [tab,setTab]=useState("login");
  const [email,setEmail]=useState("");
  const [name,setName]=useState("");
  const [pw,setPw]=useState("");
  const [err,setErr]=useState("");

  const submit=async e=>{
    e.preventDefault();setErr("");setLoading(true);
    try{
      const path=tab==="login"?"/api/auth/login":"/api/auth/register";
      const body=tab==="login"?{email,password:pw}:{name:name.trim(),email,password:pw};
      const res=await api(path,{method:"POST",body});
      onAuth(res.token,res.user);
    }catch(err){setErr(err.error||"Помилка сервера")}
    finally{setLoading(false);}

  const fi="min-h-[48px] w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:bg-white";

      <div className="mb-5 flex rounded-2xl bg-slate-100 p-1">

          <button key={t} onClick={()=>{setTab(t);setErr("")}} className={`flex-1 rounded-xl py-2 text-sm font-bold transition ${tab===t?"bg-white shadow text-slate-900":"text-slate-500"}`} style={{minHeight:"auto"}}>

        <input type="password" placeholder="Пароль (мін. 8 символів)" value={pw} onChange={e=>setPw(e.target.value)} required className={fi}/>

/* ════════════════════════════════════════════
   MAIN APP
   ════════════════════════════════════════════ */
function App(){
  /* ── auth ── */
  const [token,setToken]    = useState(()=>localStorage.getItem(TOKEN));
  const [user,setUser]      = useState(()=>ls.get(SESS));
  const [showAuth,setShowAuth] = useState(false);

  /* ── modals ── */
  const [showAddListing,setShowAddListing] = useState(false);
  const [deleteTarget,setDeleteTarget]     = useState(null);
  const [detailProp,setDetailProp]         = useState(null);
  const [showMortgage,setShowMortgage]     = useState(false);
  const [showSafety,setShowSafety]         = useState(false);
  const [showCompareModal,setShowCompareModal] = useState(false);

  /* ── listings ── */
  const [listings,setListings]   = useState([]);
  const [loading,setLoading]     = useState(true);
  const [loadErr,setLoadErr]     = useState(null);

  /* ── analytics ── */
  const [stats,setStats] = useState(null);

  /* ── compare ── */
  const [compareIds,setCompareIds] = useState([]);
  const compareItems = useMemo(()=>listings.filter(l=>compareIds.includes(l.id)),[listings,compareIds]);

  /* ── filters ── */
  const [cityFilter,setCityFilter]     = useState(()=>gf("cityFilter","Всі"));
  const [typeFilter,setTypeFilter]     = useState(()=>gf("typeFilter","Всі"));
  const [onlyEO,setOnlyEO]             = useState(()=>gf("onlyEOselya","false")==="true");
  const [minP,setMinP]                 = useState(()=>gf("minPrice",""));
  const [maxP,setMaxP]                 = useState(()=>gf("maxPrice",""));
  const [minR,setMinR]                 = useState(()=>gf("minRooms",""));
  const [maxR,setMaxR]                 = useState(()=>gf("maxRooms",""));
  const [minA,setMinA]                 = useState(()=>gf("minArea",""));
  const [maxA,setMaxA]                 = useState(()=>gf("maxArea",""));
  const [sortBy,setSortBy]             = useState(()=>gf("sortBy",DEFAULT_SORT));

  /* ── fetch listings ── */
  const fetchListings = useCallback(async()=>{
    setLoading(true);setLoadErr(null);
    try{
      const res = await api("/api/listings");
      setListings(res.listings.map(norm));
    }catch{setLoadErr("Не вдалося завантажити. Переконайтесь що сервер запущено.")}
    finally{setLoading(false);}
  },[]);

  /* ── fetch analytics ── */
  useEffect(()=>{
    api("/api/analytics/summary").then(setStats).catch(()=>{});
    fetchListings();
  },[fetchListings]);

  /* ── auto-sort for eOselya ── */
  useEffect(()=>{
    setSortBy(prev=>(prev!=="price-asc"&&prev!=="price-desc")?prev:(onlyEO?EOSELYA_SORT:DEFAULT_SORT));
  },[onlyEO]);

  /* ── persist filters ── */
  useEffect(()=>{
    const m={cityFilter,typeFilter,onlyEOselya:String(onlyEO),minPrice:minP,maxPrice:maxP,minRooms:minR,maxRooms:maxR,minArea:minA,maxArea:maxA,sortBy};
    FKEYS.forEach(k=>localStorage.setItem(FP+k,m[k]));
  },[cityFilter,typeFilter,onlyEO,minP,maxP,minR,maxR,minA,maxA,sortBy]);

  /* ── filtered + sorted ── */
  const filtered = useMemo(()=>{
    const f=listings.filter(p=>{
      if(cityFilter!=="Всі"&&p.city!==cityFilter) return false;
      if(typeFilter!=="Всі"&&p.propertyType!==typeFilter) return false;
      if(onlyEO&&!p.eOselya) return false;
      if(minP!==""&&p.price<Number(minP)) return false;
      if(maxP!==""&&p.price>Number(maxP)) return false;
      if(minR!==""&&p.rooms<Number(minR)) return false;
      if(maxR!==""&&p.rooms>Number(maxR)) return false;
      if(minA!==""&&p.area<Number(minA)) return false;
      if(maxA!==""&&p.area>Number(maxA)) return false;
      return true;
    });
    return f.sort((a,b)=>{
      if(sortBy==="price-asc")  return a.price-b.price;
      if(sortBy==="price-desc") return b.price-a.price;
      if(sortBy==="area-desc")  return b.area-a.area;
      if(sortBy==="area-asc")   return a.area-b.area;
      if(sortBy==="views-desc") return b.views-a.views;
      return 0;
    });
  },[listings,cityFilter,typeFilter,onlyEO,minP,maxP,minR,maxR,minA,maxA,sortBy]);

  /* ── handlers ── */
  const handleAuth=(newToken,newUser)=>{localStorage.setItem(TOKEN,newToken);ls.set(SESS,newUser);setToken(newToken);setUser(newUser);setShowAuth(false)};
  const handleLogout=()=>{localStorage.removeItem(TOKEN);ls.del(SESS);setToken(null);setUser(null)};
  const handleSave=listing=>{setListings(prev=>[listing,...prev]);setShowAddListing(false)};
  const handleDeleteConfirm=async()=>{
    const id=deleteTarget.id;setDeleteTarget(null);
    try{await api(`/api/listings/${id}`,{method:"DELETE",token});setListings(prev=>prev.filter(l=>l.id!==id))}
    catch(err){if(err.status===401)handleLogout();else alert(err.error||"Помилка видалення")}
  };
  const handleDetail=async p=>{
    setDetailProp(p);
    // increment view & refresh full listing
    api(`/api/listings/${p.id}/view`,{method:"POST"}).catch(()=>{});
    api(`/api/listings/${p.id}`).then(res=>{
      const updated=norm(res.listing);
      setDetailProp(updated);
      setListings(prev=>prev.map(l=>l.id===updated.id?updated:l));
    }).catch(()=>{});
  };
  const toggleCompare=p=>{
    setCompareIds(prev=>{
      if(prev.includes(p.id)) return prev.filter(id=>id!==p.id);
      if(prev.length>=MAX_COMPARE) return prev;
      return [...prev,p.id];
    });
  };
  const resetFilters=()=>{setCityFilter("Всі");setTypeFilter("Всі");setOnlyEO(false);setMinP("");setMaxP("");setMinR("");setMaxR("");setMinA("");setMaxA("");setSortBy(DEFAULT_SORT)};
  const clearSaved=()=>{FKEYS.forEach(k=>localStorage.removeItem(FP+k));resetFilters()};

  const FC="min-h-[48px] rounded-2xl border border-slate-200 bg-slate-50 px-3 py-3 text-sm outline-none transition focus:border-blue-500 focus:bg-white";

  return(
    <div className="min-h-screen bg-[radial-gradient(circle_at_top_left,rgba(59,130,246,0.10),transparent_45%),linear-gradient(180deg,#f8fafc_0%,#eef2ff_100%)]" style={{paddingBottom:compareIds.length?"80px":"0"}}>

      {/* ── Header ── */}
      <header className="sticky top-0 z-20 border-b border-slate-200/80 bg-white/90 backdrop-blur">
        <div className="mx-auto flex max-w-7xl flex-col gap-2 px-4 py-3 sm:flex-row sm:items-center sm:justify-between lg:px-6">
          <div className="flex items-center gap-3">
            <div className="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-blue-600 text-base font-black text-white shadow-lg shadow-blue-100">UA</div>
            <div>
              <div className="text-lg font-black tracking-tight text-slate-900">UA Homes</div>
              <div className="text-xs font-semibold uppercase tracking-[0.25em] text-slate-500">Нерухомість в Україні</div>
            </div>
          </div>
          <nav className="hidden md:flex items-center gap-1 text-sm font-semibold text-slate-600">
            <button onClick={()=>setShowMortgage(true)} className="rounded-xl px-3 py-2 hover:bg-slate-100 transition" style={{minHeight:"auto"}}>🏦 Калькулятор</button>
            <button onClick={()=>setShowSafety(true)} className="rounded-xl px-3 py-2 hover:bg-slate-100 transition" style={{minHeight:"auto"}}>✅ Чек-лист</button>
          </nav>
          <div className="flex items-center gap-2 flex-wrap">
            {user?(
              <>
                <span className="rounded-2xl bg-slate-100 px-3 py-2 text-sm font-semibold text-slate-700">👤 {user.name}</span>
                <button onClick={()=>setShowAddListing(true)} className="min-h-[44px] rounded-2xl bg-blue-600 px-4 text-sm font-bold text-white shadow-lg shadow-blue-100 hover:bg-blue-700 transition">+ Додати</button>
                <button onClick={handleLogout} className="min-h-[44px] rounded-2xl border border-slate-200 px-4 text-sm font-bold text-slate-600 hover:bg-slate-50 transition">Вийти</button>
              </>
            ):(
              <button onClick={()=>setShowAuth(true)} className="min-h-[44px] rounded-2xl bg-blue-600 px-5 text-sm font-bold text-white shadow-lg shadow-blue-100 hover:bg-blue-700 transition">Увійти</button>
            )}
          </div>
        </div>
      </header>

      <main className="mx-auto flex max-w-7xl flex-col gap-6 px-4 py-6 lg:px-6 lg:py-8">

        {/* ── Hero ── */}
        <section className="overflow-hidden rounded-[32px] bg-gradient-to-br from-slate-900 via-slate-800 to-blue-900 p-5 text-white shadow-2xl sm:p-8">
          <div className="flex flex-col gap-6 lg:flex-row lg:items-end lg:justify-between">
            <div className="max-w-2xl">
              <div className="mb-3 inline-flex rounded-full border border-white/20 bg-white/10 px-3 py-1 text-xs font-semibold backdrop-blur">Квартири · Будинки · Комерція</div>
              <h1 className="text-3xl font-black leading-tight sm:text-4xl">UA Homes — нерухомість в Україні</h1>
              <p className="mt-2 max-w-xl text-sm text-slate-300">Фотогалерея · Карта · єОселя калькулятор · Порівняння · Відгуки</p>
              <div className="mt-4 flex flex-wrap gap-2">
                <button onClick={()=>setShowMortgage(true)} className="min-h-[40px] rounded-2xl bg-white/15 border border-white/25 px-4 text-sm font-bold backdrop-blur hover:bg-white/25 transition">🏦 Калькулятор іпотеки</button>
                <button onClick={()=>setShowSafety(true)} className="min-h-[40px] rounded-2xl bg-white/15 border border-white/25 px-4 text-sm font-bold backdrop-blur hover:bg-white/25 transition">✅ Чек-лист документів</button>
              </div>
            </div>
            {stats&&(
              <div className="flex gap-4 flex-wrap">
                {[["Оголошень",stats.total],["Середня ціна","$"+Number(stats.avg_price).toLocaleString()]].map(([l,v])=>(
                  <div key={l} className="rounded-2xl border border-white/20 bg-white/10 px-5 py-4 backdrop-blur text-center">
                    <div className="text-2xl font-black">{v}</div>
                    <div className="text-xs text-slate-300 mt-1">{l}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </section>

        {/* ── Filters ── */}
        <section className="rounded-[28px] border border-slate-200 bg-white p-4 shadow-sm sm:p-5">
          <div className="grid gap-4 xl:grid-cols-[1.4fr_0.6fr]">
            <div className="grid gap-3 md:grid-cols-2 xl:grid-cols-3">
              <div>
                <label className="mb-1.5 block text-xs font-black uppercase tracking-wide text-slate-400">Місто</label>
                <select value={cityFilter} onChange={e=>setCityFilter(e.target.value)} className={`w-full ${FC} font-semibold`}>
                  {CITIES.map(c=><option key={c} value={c}>{c==="Всі"?"Всі міста України":c}</option>)}
                </select>
              </div>
              <div>
                <label className="mb-1.5 block text-xs font-black uppercase tracking-wide text-slate-400">Тип об'єкта</label>
                <select value={typeFilter} onChange={e=>setTypeFilter(e.target.value)} className={`w-full ${FC} font-semibold`}>
                  {PTYPES.map(t=><option key={t} value={t}>{t==="Всі"?"Всі типи":t}</option>)}
                </select>
              </div>
              <div>
                <label className="mb-1.5 block text-xs font-black uppercase tracking-wide text-slate-400">Ціна, $</label>
                <div className="grid grid-cols-2 gap-2">
                  <input type="number" min="0" placeholder="від" value={minP} onChange={e=>setMinP(e.target.value)} className={FC}/>
                  <input type="number" min="0" placeholder="до" value={maxP} onChange={e=>setMaxP(e.target.value)} className={FC}/>
                </div>
              </div>
              <div>
                <label className="mb-1.5 block text-xs font-black uppercase tracking-wide text-slate-400">Кімнати</label>
                <div className="grid grid-cols-2 gap-2">
                  <input type="number" min="0" placeholder="від" value={minR} onChange={e=>setMinR(e.target.value)} className={FC}/>
                  <input type="number" min="0" placeholder="до" value={maxR} onChange={e=>setMaxR(e.target.value)} className={FC}/>
                </div>
              </div>
              <div>
                <label className="mb-1.5 block text-xs font-black uppercase tracking-wide text-slate-400">Площа, м²</label>
                <div className="grid grid-cols-2 gap-2">
                  <input type="number" min="0" placeholder="від" value={minA} onChange={e=>setMinA(e.target.value)} className={FC}/>
                  <input type="number" min="0" placeholder="до" value={maxA} onChange={e=>setMaxA(e.target.value)} className={FC}/>
                </div>
              </div>
              <div>
                <label className="mb-1.5 block text-xs font-black uppercase tracking-wide text-slate-400">Сортування</label>
                <select value={sortBy} onChange={e=>setSortBy(e.target.value)} className={`w-full ${FC} font-semibold`}>
                  <option value="price-asc">Дешевші спочатку</option>
                  <option value="price-desc">Дорожчі спочатку</option>
                  <option value="area-desc">Більша площа</option>
                  <option value="area-asc">Менша площа</option>
                  <option value="views-desc">Популярні</option>
                  <option value="newest">Нові</option>
                </select>
              </div>
            </div>
            <div className="flex flex-col justify-between rounded-[24px] bg-slate-900 p-5 text-white gap-4">
              <div>
                <div className="text-xs font-semibold uppercase tracking-wide text-slate-400">Знайдено</div>
                <div className="mt-1 text-4xl font-black">{filtered.length}</div>
                <div className="mt-1 text-sm text-slate-300">пропозицій</div>
              </div>
              <label className="flex cursor-pointer items-center gap-3">
                <input type="checkbox" checked={onlyEO} onChange={e=>setOnlyEO(e.target.checked)} className="h-5 w-5"/>
                <span className="text-sm font-semibold">Тільки <span className="text-blue-400">єОселя</span></span>
              </label>
              <div className="flex flex-wrap gap-2">
                <button onClick={resetFilters} className="min-h-[44px] rounded-2xl bg-white px-4 text-sm font-bold text-slate-900 hover:bg-slate-100 transition">Скинути</button>
                <button onClick={clearSaved} className="min-h-[44px] rounded-2xl border border-white/20 px-4 text-sm font-bold text-white hover:bg-white/10 transition">Очистити</button>
              </div>
            </div>
          </div>
        </section>

        {/* ── Listings + Sidebar ── */}
        <div className="grid gap-6 lg:grid-cols-[1.35fr_0.65fr]">
          <div className="space-y-4">
            {loading?(
              <div className="rounded-[28px] border border-slate-200 bg-white py-16 text-center">
                <p className="animate-pulse text-slate-400 font-medium">Завантаження оголошень…</p>
              </div>
            ):loadErr?(
              <div className="rounded-[28px] border border-red-200 bg-red-50 p-6 text-center">
                <p className="text-red-600 font-medium">{loadErr}</p>
                <button onClick={fetchListings} className="mt-3 text-blue-600 font-bold underline" style={{minHeight:"auto"}}>Спробувати знову</button>
              </div>
            ):filtered.length===0?(
              <div className="rounded-[28px] border border-dashed border-slate-300 bg-white py-16 text-center">
                <p className="text-slate-400 font-medium">За фільтрами нічого не знайдено.</p>
                <button onClick={resetFilters} className="mt-3 text-blue-600 font-bold underline" style={{minHeight:"auto"}}>Скинути фільтри</button>
              </div>
            ):filtered.map(p=>(
              <PropertyCard key={p.id} property={p} currentUser={user} onDelete={setDeleteTarget} onDetail={handleDetail} onCompare={toggleCompare} isCompared={compareIds.includes(p.id)}/>
            ))}
          </div>

          <aside className="space-y-4">
            {/* Mortgage mini */}
            <div className="rounded-[28px] border border-slate-200 bg-white p-5">
              <div className="text-xs font-black uppercase tracking-wide text-slate-400 mb-2">Іпотека єОселя</div>
              <div className="text-2xl font-black text-slate-900 mb-1">3% або 7%</div>
              <p className="text-sm text-slate-500 mb-4">Розрахуйте щомісячний платіж для будь-якого об'єкта за державною програмою.</p>
              <button onClick={()=>setShowMortgage(true)} className="w-full min-h-[44px] rounded-2xl bg-blue-600 font-bold text-white hover:bg-blue-700 transition">Відкрити калькулятор</button>
            </div>

            {/* Analytics */}
            <AnalyticsSection stats={stats}/>

            {/* Safety */}
            <div className="rounded-[28px] border border-amber-200 bg-amber-50 p-5">
              <div className="text-xs font-black uppercase tracking-wide text-amber-600 mb-2">Безпека угоди</div>
              <div className="text-lg font-black text-slate-900 mb-1">Перевір документи</div>
              <p className="text-sm text-slate-600 mb-4">10 обов'язкових кроків перед підписанням договору купівлі-продажу.</p>
              <button onClick={()=>setShowSafety(true)} className="w-full min-h-[44px] rounded-2xl bg-amber-500 font-bold text-white hover:bg-amber-600 transition">Відкрити чек-лист</button>
            </div>

            {!user&&(
              <div className="rounded-[28px] border border-blue-200 bg-blue-50 p-5">
                <div className="text-lg font-black text-slate-900">Маєте нерухомість?</div>
                <p className="mt-2 text-sm text-slate-600">Зареєструйтесь і безкоштовно розмістіть оголошення.</p>
                <button onClick={()=>setShowAuth(true)} className="mt-4 min-h-[44px] w-full rounded-2xl bg-blue-600 font-bold text-white hover:bg-blue-700 transition">Розмістити</button>
              </div>
            )}
          </aside>
        </div>

      </main>

      {/* ── Modals ── */}
      {showAuth&&<AuthModal onClose={()=>setShowAuth(false)} onAuth={handleAuth}/>}
      {showAddListing&&<AddListingModal onClose={()=>setShowAddListing(false)} onSave={handleSave} token={token}/>}
      {deleteTarget&&<DeleteModal title={deleteTarget.title} onClose={()=>setDeleteTarget(null)} onConfirm={handleDeleteConfirm}/>}
      {detailProp&&<PropertyDetailModal property={detailProp} currentUser={user} token={token} onClose={()=>setDetailProp(null)} onDelete={setDeleteTarget} onReviewAdded={()=>{}}/>}
      {showMortgage&&<MortgageCalcModal onClose={()=>setShowMortgage(false)}/>}
      {showSafety&&<SafetyModal onClose={()=>setShowSafety(false)}/>}
      {showCompareModal&&compareItems.length>=2&&<CompareModal items={compareItems} onClose={()=>setShowCompareModal(false)}/>}

      {/* ── Compare Bar ── */}
      <CompareBar items={compareItems} onRemove={id=>setCompareIds(p=>p.filter(x=>x!==id))} onOpen={()=>setShowCompareModal(true)} onClear={()=>setCompareIds([])}/>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(r => console.log('SW registered:', r.scope))
        .catch(e => console.log('SW failed:', e));
    });
  }
</script>
</body>
</html>
