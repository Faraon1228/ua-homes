  <style>
    :root{color-scheme:light}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
    button,input,select,textarea{min-height:44px;touch-action:manipulation;font:inherit}
    textarea{min-height:auto}
    @supports(padding:max(0px)){body{padding-bottom:max(1rem,env(safe-area-inset-bottom))}}
    .modal-backdrop{animation:fadeIn .15s ease}
    .modal-box{animation:slideUp .22s ease}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}
    .gallery-img{transition:opacity .25s}
    .star-btn{background:none;border:none;padding:0;min-height:auto;cursor:pointer;line-height:1;font-size:1.5rem}
    .leaflet-container{border-radius:1.25rem}
    .compare-bar{animation:slideUp .2s ease}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .animate-pulse{animation:pulse 1.5s cubic-bezier(.4,0,.6,1) infinite}
    .app-shell-skeleton{max-width:80rem;margin:0 auto;padding:1.5rem 1rem 2rem}
    .app-shell-shimmer{background:linear-gradient(90deg,#e2e8f0 25%,#f8fafc 37%,#e2e8f0 63%);background-size:400% 100%;animation:appShellShimmer 1.4s ease infinite}
    @keyframes appShellShimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:#f1f5f9}
    ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9999px}
  </style>

<body class="min-h-screen bg-slate-100 text-slate-900">
<div id="root">
  <div class="app-shell-skeleton" aria-hidden="true">
    <div class="app-shell-shimmer" style="height:72px;border-radius:28px"></div>
    <div class="app-shell-shimmer" style="height:220px;border-radius:32px;margin-top:24px"></div>
    <div style="display:grid;gap:24px;margin-top:24px">
      <div class="app-shell-shimmer" style="height:320px;border-radius:28px"></div>
      <div class="app-shell-shimmer" style="height:320px;border-radius:28px"></div>
      <div class="app-shell-shimmer" style="height:320px;border-radius:28px"></div>
    </div>
  </div>
</div>

<script defer src="real-estate-app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      const register = () => navigator.serviceWorker.register('/sw.js').catch(() => {});
      if ('requestIdleCallback' in window) {
        requestIdleCallback(register, { timeout: 2000 });
      } else {
        setTimeout(register, 1200);
      }
    });
  }
</script>
</body>
