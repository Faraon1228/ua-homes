<script>
  (function () {
    const resolveApiBase = () => {
      if (window.UA_HOMES_API) return window.UA_HOMES_API;
      const configured = "__UA_HOMES_API__";
      if (configured && configured !== "__UA_HOMES_API__") return configured;
      const host = location.hostname;
      if (!host || location.protocol === "file:") return "http://localhost:5050";
      if (host === "localhost" || host === "127.0.0.1") return "http://localhost:5050";
      if (!host.includes("192.168") && !/^\d+\.\d+/.test(host)) {
        return `https://${host.replace(/^www\./, "")}`.replace(/\/$/, "") + "/api-backend";
      }
      return `http://${host}:5050`;
    };

    const API_BASE = resolveApiBase().replace(/\/+$/, "");
    const OBS_SESSION_KEY = "uah.obs.session";
    const sentVitals = new Set();
    let clsValue = 0;
    let lcpEntry = null;

    const sessionId = (() => {
      const existing = window.sessionStorage.getItem(OBS_SESSION_KEY);
      if (existing) return existing;
      const generated =
        (window.crypto && typeof window.crypto.randomUUID === "function"
          ? window.crypto.randomUUID()
          : `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`);
      window.sessionStorage.setItem(OBS_SESSION_KEY, generated);
      return generated;
    })();

    const postTelemetry = (path, payload) =>
      fetch(`${API_BASE}${path}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "omit",
        keepalive: true,
        body: JSON.stringify(payload),
      }).catch(() => {});

    const reportWebVital = (name, value, rating, extra) => {
      if (!name || Number.isNaN(Number(value))) return;
      const uniqueId = `${name}:${extra?.id || ""}`;
      if (sentVitals.has(uniqueId)) return;
      sentVitals.add(uniqueId);
      void postTelemetry("/api/analytics/web-vitals", {
        name,
        value: Number(value),
        rating: rating || null,
        page_url: window.location.href,
        source: "real-estate-demo-shell",
        session_id: sessionId,
        id: extra?.id || null,
        navigation_type: extra?.navigationType || null,
        delta: typeof extra?.delta === "number" ? extra.delta : null,
      });
    };

    const reportClientError = (type, message, details) => {
      void postTelemetry("/api/analytics/client-telemetry", {
        event_type: type,
        message: String(message || "").slice(0, 1200),
        source: "real-estate-demo-shell",
        page_url: window.location.href,
        session_id: sessionId,
        payload: details || null,
      });
    };

    window.addEventListener("error", (event) => {
      reportClientError("runtime_error", event.message || "Unknown runtime error", {
        filename: event.filename || null,
        lineno: event.lineno || null,
        colno: event.colno || null,
        stack: event.error && event.error.stack ? String(event.error.stack).slice(0, 8000) : null,
      });
    });

    window.addEventListener("unhandledrejection", (event) => {
      const reason =
        typeof event.reason === "string"
          ? event.reason
          : event.reason && event.reason.message
            ? event.reason.message
            : "Unhandled promise rejection";
      const stack =
        event.reason && event.reason.stack ? String(event.reason.stack).slice(0, 8000) : null;
      reportClientError("unhandled_rejection", reason, { stack });
    });

    if ("PerformanceObserver" in window) {
      try {
        const paintObserver = new PerformanceObserver((list) => {
          list.getEntries().forEach((entry) => {
            if (entry.name === "first-contentful-paint") {
              reportWebVital("FCP", entry.startTime, entry.startTime <= 1800 ? "good" : entry.startTime <= 3000 ? "needs-improvement" : "poor", {
                id: "fcp",
              });
            }
          });
        });
        paintObserver.observe({ type: "paint", buffered: true });
      } catch (_err) {}

      try {
        const lcpObserver = new PerformanceObserver((list) => {
          const entries = list.getEntries();
          lcpEntry = entries[entries.length - 1] || lcpEntry;
        });
        lcpObserver.observe({ type: "largest-contentful-paint", buffered: true });
      } catch (_err) {}

      try {
        const clsObserver = new PerformanceObserver((list) => {
          list.getEntries().forEach((entry) => {
            if (!entry.hadRecentInput) clsValue += entry.value;
          });
        });
        clsObserver.observe({ type: "layout-shift", buffered: true });
      } catch (_err) {}

      try {
        const fidObserver = new PerformanceObserver((list) => {
          const firstInput = list.getEntries()[0];
          if (!firstInput) return;
          reportWebVital(
            "FID",
            firstInput.processingStart - firstInput.startTime,
            firstInput.processingStart - firstInput.startTime <= 100
              ? "good"
              : firstInput.processingStart - firstInput.startTime <= 300
                ? "needs-improvement"
                : "poor",
            { id: firstInput.name || "fid" }
          );
        });
        fidObserver.observe({ type: "first-input", buffered: true });
      } catch (_err) {}
    }

    const flushFinalVitals = () => {
      if (lcpEntry) {
        reportWebVital("LCP", lcpEntry.startTime, lcpEntry.startTime <= 2500 ? "good" : lcpEntry.startTime <= 4000 ? "needs-improvement" : "poor", {
          id: "lcp",
        });
      }
      reportWebVital("CLS", clsValue, clsValue <= 0.1 ? "good" : clsValue <= 0.25 ? "needs-improvement" : "poor", {
        id: "cls",
      });
    };

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") flushFinalVitals();
    });
    window.addEventListener("beforeunload", flushFinalVitals);
  })();
</script>
