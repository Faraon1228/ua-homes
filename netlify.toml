[build]
  publish = "web"
  command = "echo 'Static site — no build needed'"

# Proxy API calls to the Railway backend.
[[redirects]]
  from = "/api/*"
  to = "https://backend-production-51964.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api-backend/*"
  to = "https://backend-production-51964.up.railway.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/demo-images/*"
  to = "https://backend-production-51964.up.railway.app/api/demo-images/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.png"
  status = 200

[[redirects]]
  from = "/apple-touch-icon.png"
  to = "/icons/Icon-192.png"
  status = 200

[[redirects]]
  from = "/apple-touch-icon-precomposed.png"
  to = "/icons/Icon-192.png"
  status = 200

# Redirect legacy ua-dom hostnames to primary ua-dim domain
[[redirects]]
  from = "https://ua-dom.com/*"
  to = "https://ua-dim.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.ua-dom.com/*"
  to = "https://ua-dim.com/:splat"
  status = 301
  force = true

# Redirect www.ua-dim.com → ua-dim.com (canonical domain)
[[redirects]]
  from = "https://www.ua-dim.com/*"
  to = "https://ua-dim.com/:splat"
  status = 301
  force = true

# /app → main SPA
[[redirects]]
  from = "/app"
  to = "/real-estate-demo.html"
  status = 200

# /app/* → main SPA (for any sub-paths)
[[redirects]]
  from = "/app/*"
  to = "/real-estate-demo.html"
  status = 200

# Dedicated seller cabinet route
[[redirects]]
  from = "/seller"
  to = "/real-estate-demo.html"
  status = 200

# /admin → admin panel
[[redirects]]
  from = "/admin"
  to = "/admin/login.html"
  status = 302

# SEO pages and ЖК detail pages → backend-rendered routes
[[redirects]]
  from = "/seo/*"
  to = "https://backend-production-51964.up.railway.app/seo/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/zhk/*"
  to = "https://backend-production-51964.up.railway.app/zhk/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/listing/*"
  to = "https://backend-production-51964.up.railway.app/listing/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "https://backend-production-51964.up.railway.app/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/agencies"
  to = "https://backend-production-51964.up.railway.app/agencies"
  status = 200
  force = true

[[redirects]]
  from = "/agencies/*"
  to = "https://backend-production-51964.up.railway.app/agencies/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/insights"
  to = "https://backend-production-51964.up.railway.app/insights"
  status = 200
  force = true

[[redirects]]
  from = "/insights/*"
  to = "https://backend-production-51964.up.railway.app/insights/:splat"
  status = 200
  force = true

[[redirects]]
from = "/privacy"
to = "/privacy.html"
status = 301

[[redirects]]
from = "/terms"
to = "/terms.html"
status = 301

[[redirects]]
from = "/cookies"
to = "/cookie-policy.html"
status = 301

# Root → main app shell
[[redirects]]
  from = "/"
  to = "/real-estate-demo.html"
  status = 200

# Everything else → SPA fallback
[[redirects]]
  from = "/*"
  to = "/real-estate-demo.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-Permitted-Cross-Domain-Policies = "none"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://www.liqpay.ua; img-src 'self' data: blob: https://res.cloudinary.com https://*.amazonaws.com https://*.cloudfront.net https://images.unsplash.com https://picsum.photos https://fastly.picsum.photos https://*.tile.openstreetmap.org https://www.google-analytics.com https://www.googletagmanager.com; media-src 'self' blob: https://res.cloudinary.com https://*.amazonaws.com https://*.cloudfront.net; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.tailwindcss.com https://www.googletagmanager.com https://www.google-analytics.com https://ssl.google-analytics.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com https://fonts.googleapis.com; connect-src 'self' https://api.cloudinary.com https://res.cloudinary.com https://*.amazonaws.com https://*.cloudfront.net https://*.railway.app https://*.netlify.app https://ua-dim.com https://www.ua-dim.com https://ua-dom.com https://www.ua-dom.com https://www.google-analytics.com https://region1.google-analytics.com https://analytics.google.com https://www.googletagmanager.com; font-src 'self' data: https://fonts.gstatic.com; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none';"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/launch.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/real-estate-demo.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    Vary = "Accept-Encoding"

[[headers]]
for = "/*-policy.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
for = "/privacy.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
for = "/terms.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/api-backend/*"
  [headers.values]
    Cache-Control = "public, max-age=20, must-revalidate"
    Vary = "Accept-Encoding"
    X-Cache-Control = "public, s-maxage=20"
