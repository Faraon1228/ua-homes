[build]
  publish = "web"
  command = "echo 'Static site — no build needed'"

# Proxy API calls to the Railway backend.
# Replace YOUR_RAILWAY_URL with your actual Railway app URL
# e.g. https://ua-homes-production.up.railway.app
[[redirects]]
  from = "/api-backend/*"
  to = "https://YOUR_RAILWAY_URL/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/real-estate-demo.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/real-estate-demo.html"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
