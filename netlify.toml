[build]
  publish = "web"
  command = "echo 'Static site — no build needed'"

# Proxy API calls to the Railway backend.
[[redirects]]
  from = "/api-backend/*"
  to = "https://backend-production-51964.up.railway.app/api/:splat"
  status = 200
  force = true

# Redirect www → non-www (canonical domain)
[[redirects]]
  from = "https://www.ua-dom.com/*"
  to = "https://ua-dom.com/:splat"
  status = 301
  force = true

# /app → main SPA
[[redirects]]
  from = "/app"
  to = "/real-estate-demo.html"
  status = 200

# /app/* → main SPA (for any sub-paths)
[[redirects]]
  from = "/app/*"
  to = "/real-estate-demo.html"
  status = 200

# /admin → admin panel
[[redirects]]
  from = "/admin"
  to = "/admin/login.html"
  status = 302

# Root → main app shell
[[redirects]]
  from = "/"
  to = "/real-estate-demo.html"
  status = 200

# Everything else → SPA fallback
[[redirects]]
  from = "/*"
  to = "/real-estate-demo.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/launch.html"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/real-estate-demo.html"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
