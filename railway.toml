# Root railway.toml — tells Railway to deploy the backend/ subdirectory
#
# Railway's active service config actually comes from backend/railway.toml
# (rootDirectory=backend, configFile=/backend/railway.toml per the linked
# service). This root file is kept in sync as a safety net against
# dashboard/config drift — always update both files together.

[build]
builder = "nixpacks"
buildCommand = "pip install --require-hashes -r backend/requirements.lock.txt"
watchPatterns = ["backend/**"]

[deploy]
startCommand = "gunicorn -c gunicorn.conf.py app:app"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
